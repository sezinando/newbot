name: EAGOLD one-shot repair

on:
  push:
    paths:
      - '.github/workflows/eagold-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair EAGOLD recovery and compile issue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('EA/EAGOLD.mq4')
          s = p.read_text(encoding='utf-8')
          old = 'void SellMachine(){if(SellBasketTargetReached()&&DirectionLots(OP_SELL)>DirectionLots(OP_BUY))Rule10Reduce(OP_SELL);bool basketClosed=SellBasketClose();if(basketClosed)RestartEmptyBasket(OP_SELL);SellSingleTakeProfit();}'
          new = 'void SellMachine(){if(SellBasketTargetReached()&&DirectionLots(OP_SELL)>DirectionLots(OP_BUY))Rule10Reduce(OP_SELL);bool basketClosed=SellBasketClose();if(basketClosed)RestartEmptyBasket(OP_SELL);SellSingleTakeProfit();SellRecovery();}'
          if old not in s:
              raise SystemExit('Expected SellMachine signature not found; aborting')
          s = s.replace(old, new, 1)
          s = s.replace('ObjectsTotal(0)', 'ObjectsTotal()', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EA/EAGOLD.mq4
          git commit -m 'fix: restore sell recovery engine'
          git push
          git rm .github/workflows/eagold-repair.yml
          git commit -m 'chore: remove one-shot repair workflow'
          git push
